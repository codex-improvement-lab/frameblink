name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  package-and-demo:
    name: package-and-demo (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install wheel dependencies and source
        run: python -m pip install -e .
      - name: Workflow tests
        run: python -m unittest discover -s tests -v
      - name: Build wheel and source archive
        run: |
          python -m pip install build
          python -m build --wheel --sdist
      - name: Clean packaged first use
        run: python scripts/package_smoke.py dist/frameblink-0.1.0a1-py3-none-any.whl
