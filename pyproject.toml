[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frameblink"
version = "0.1.0a1"
description = "Find short-lived visual reversion candidates in local screen recordings."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Elias S.W."}]
dependencies = [
  "av==18.1.0",
  "numpy>=2.0,<3",
  "Pillow>=11,<13",
]
keywords = ["agents", "screen-recording", "flicker", "video", "visual-debugging"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/codex-improvement-lab/frameblink"

[project.scripts]
frameblink = "frameblink.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
frameblink = ["assets/*.mp4"]
